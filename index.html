<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repair the Robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071226; --navy2:#0c1d3a; --panel:rgba(8,20,42,.78);
  --cyan:#3fd8ff; --blue:#2f8cff; --yellow:#ffd23f; --green:#3ee08a;
  --white:#eef3f8; --muted:#8fa3bf; --red:#ff5a6a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--white);
  font-family:'Exo 2',system-ui,-apple-system,sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-drag:none}

/* ---------- Lab background / stage ---------- */
#backdrop{position:fixed;inset:-60px;background:url("BG.jpg.png") center/cover;filter:blur(22px) brightness(.38) saturate(1.3)}
#stage{position:absolute;left:50%;top:50%;width:1448px;height:1086px;transform-origin:center center;
  background:url("BG.jpg.png") 0 0/100% 100% no-repeat;box-shadow:0 0 120px 40px rgba(7,18,38,.9)}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 65% at 50% 56%,rgba(7,18,38,0) 40%,rgba(7,18,38,.55) 100%),
             linear-gradient(rgba(10,24,52,.12),rgba(10,24,52,.12))}
/* camera: zooms onto the robot body while the panel is open */
#cam{position:absolute;inset:0;transform-origin:724px 640px;transition:transform .8s cubic-bezier(.45,0,.2,1)}
#cam.zoom{transform:scale(var(--z,1.6))}

#platformGlow{position:absolute;left:444px;top:668px;width:560px;height:150px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(63,216,255,.75) 0%,rgba(47,140,255,.35) 40%,rgba(47,140,255,0) 70%);
  opacity:0;transition:opacity 1s ease;pointer-events:none;mix-blend-mode:screen}
.alive-scene #platformGlow{opacity:1;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}

/* ---------- Robot (native asset units, scaled up) ---------- */
#robot{position:absolute;left:520px;top:231px;width:170px;height:222px;transform-origin:0 0;transform:scale(2.4)}
#robotInner{position:absolute;inset:0}
.alive-scene #robotInner{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.arm{position:absolute;top:106px;width:29px;height:114px;z-index:1;transition:filter .8s}
.arm.left{left:3.5px;transform-origin:50% 8%}
.arm.right{left:137.5px;transform-origin:50% 8%}
#head{position:absolute;left:19px;top:0;width:132px;height:114px;z-index:2}
#headImg{width:100%;height:100%;display:block;transition:filter .8s}
#antennaGlow{position:absolute;left:54px;top:-5.5px;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle,rgba(160,240,255,.95) 0%,rgba(63,216,255,.6) 35%,rgba(63,216,255,0) 70%);
  opacity:0;pointer-events:none;mix-blend-mode:screen}
#bodyWrap{position:absolute;left:29.5px;top:110px;width:111px;height:107px;z-index:3;perspective:600px}
#interior{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none}
#door{position:absolute;inset:0;transform-origin:0 50%;transition:transform .75s cubic-bezier(.5,.05,.25,1.1);
  outline:none;transform-style:preserve-3d}
#door .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:filter .3s}
#door .back{transform:rotateY(180deg);border-radius:5px;background:linear-gradient(135deg,#dfe3e8,#b3bac5);
  box-shadow:inset 0 0 0 1px #8e97a5,inset 0 0 0 4px #cdd2d9,inset 0 0 0 4.6px #9aa3b0}
#door .back::before{content:"";position:absolute;left:14px;right:14px;top:30px;height:2px;border-radius:2px;background:#9aa3b0;box-shadow:0 8px 0 #9aa3b0,0 16px 0 #9aa3b0}
#door img{width:100%;height:100%;display:block;transition:filter .8s}
#door.open{transform:rotateY(-118deg)}

.off .arm,.off #door img{filter:saturate(.25) brightness(.82)}
.off #headImg{filter:brightness(.9)}

/* Door glow (only on open / close steps) */
#door::after{content:"";position:absolute;inset:-1.5px;border-radius:5px;border:1px solid var(--cyan);
  box-shadow:0 0 4px var(--cyan),inset 0 0 4px rgba(63,216,255,.6);opacity:0;pointer-events:none}
[data-step=open] #door,[data-step=close] #door{cursor:pointer}
[data-step=open] #door::after,[data-step=close] #door::after{animation:pulse 1.5s ease-in-out infinite}
[data-step=open] #door:hover .face,[data-step=close] #door:hover .face,
[data-step=open] #door:focus-visible .face,[data-step=close] #door:focus-visible .face{filter:drop-shadow(0 0 3px rgba(63,216,255,.95)) brightness(1.08)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

.tag{position:absolute;left:50%;top:76px;transform:translateX(-50%);font:700 5px/1 'Orbitron',sans-serif;letter-spacing:.6px;
  color:#0b2440;background:var(--cyan);padding:1.6px 3px 1.4px;border-radius:2px;box-shadow:0 0 4px var(--cyan);
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
[data-step=open] .tag,[data-step=close] .tag{opacity:1}

#powerBtn{position:absolute;left:41px;top:41px;width:25px;height:25px;border-radius:50%;outline:none}
#powerBtn::before{content:"";position:absolute;inset:-2.5px;border-radius:50%;border:1.2px solid var(--cyan);
  box-shadow:0 0 6px 1px var(--cyan),inset 0 0 6px var(--cyan);opacity:0;transition:opacity .4s}
[data-step=power] #powerBtn{cursor:pointer}
[data-step=power] #powerBtn::before{opacity:1;animation:powerPulse 1.2s ease-in-out infinite}
[data-step=power] #powerBtn:hover::before{box-shadow:0 0 10px 2px var(--cyan),inset 0 0 8px var(--cyan)}
#powerBtn.pressed{transform:scale(.88);transition:transform .12s}
.alive-scene #powerBtn::before{opacity:1;animation:none;box-shadow:0 0 5px 1px var(--cyan)}
@keyframes powerPulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.12);opacity:1}}

/* Alive state */
.alive-scene #door img{filter:drop-shadow(0 0 4px rgba(63,216,255,.75))}
.alive-scene #headImg{filter:drop-shadow(0 0 3px rgba(63,216,255,.6))}
.alive-scene #antennaGlow{opacity:1;animation:antenna 1.4s ease-in-out infinite}
@keyframes antenna{50%{transform:scale(1.35);opacity:.7}}
.alive-scene .arm.left{animation:waveL 2.4s ease-in-out .3s 2}
.alive-scene .arm.right{animation:waveR 2.4s ease-in-out .3s 2}
@keyframes waveL{30%{transform:rotate(14deg)}60%{transform:rotate(4deg)}}
@keyframes waveR{30%{transform:rotate(-14deg)}60%{transform:rotate(-4deg)}}
#headImg.flicker{animation:flicker .7s steps(1) 1}
@keyframes flicker{0%{opacity:1}15%{opacity:.2}30%{opacity:1}45%{opacity:.1}60%{opacity:1}75%{opacity:.4}100%{opacity:1}}

/* ---------- Interior SVG states ---------- */
.slot-outline{fill:rgba(63,216,255,.04);stroke:var(--cyan);stroke-width:.6;stroke-dasharray:2 1.4;opacity:.4;transition:opacity .25s,fill .25s}
.slot-ghost{opacity:.12;filter:grayscale(1) brightness(1.6)}
.slot-label{font:600 3.2px 'Orbitron',sans-serif;fill:#7fb6e6;letter-spacing:.3px;opacity:.75}
.target .slot-outline{opacity:1;stroke-width:.8;animation:svgPulse 1.3s ease-in-out infinite}
.target .slot-label{fill:var(--yellow);opacity:1}
.target.over .slot-outline{fill:rgba(63,216,255,.28);stroke-dasharray:none;animation:none;filter:url(#glow)}
.slot.done .slot-outline{opacity:0}
.slot.done .slot-ghost,.slot.done .slot-label{opacity:0}
@keyframes svgPulse{50%{opacity:.45}}
.halo{fill:var(--cyan);opacity:0;pointer-events:none}
[data-step=wire] .halo{animation:haloPulse 1.2s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.15}50%{opacity:.6}}
#plugHit{fill:transparent}
[data-step=wire] #plug{cursor:grab}
[data-step=wire] #plug:active{cursor:grabbing}
.installed{opacity:0;transform-box:fill-box;transform-origin:center}
.installed.on{opacity:1;animation:snapIn .35s ease-out}
@keyframes snapIn{0%{transform:scale(1.15)}60%{transform:scale(.96)}100%{transform:scale(1)}}
#memLed{fill:#24324a;transition:fill .3s}
#memLed.on{fill:#5cc8ff;filter:url(#glow);animation:ledOn .6s steps(1) 1}
@keyframes ledOn{0%{fill:#24324a}30%{fill:#5cc8ff}50%{fill:#24324a}70%{fill:#5cc8ff}}
#screwHead{transform-box:fill-box;transform-origin:center}
#screwBody{transition:transform .5s ease-in}
#screwBody.loose{transform:translate(1.6px,-1.8px)}
#screwHead.loose{transform:rotate(28deg)}
#screwHead.spin{animation:screwSpin 1.1s linear 1}
@keyframes screwSpin{from{transform:rotate(28deg)}to{transform:rotate(1108deg)}}
#screwShadow{transition:all .5s}
.check{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.spark{animation:spark .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}

/* ---------- HUD ---------- */
.panel{background:var(--panel);border:1px solid rgba(63,216,255,.32);border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 18px rgba(63,216,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel h3{margin:0 0 10px;font:700 11px/1 'Orbitron',sans-serif;letter-spacing:2px;color:var(--cyan)}

#progress{position:fixed;left:20px;top:20px;padding:14px 18px 12px;min-width:150px;z-index:10}
#progress ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
#progress li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--muted);transition:color .3s}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #44597a;display:grid;place-items:center;font-size:12px;line-height:1;color:transparent;transition:all .3s;flex:none}
#progress li.current{color:var(--yellow)}
#progress li.current .dot{border-color:var(--yellow);box-shadow:0 0 8px rgba(255,210,63,.6)}
#progress li.done{color:var(--green)}
#progress li.done .dot{border-color:var(--green);background:var(--green);color:#06231a;font-weight:900;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

#instr{position:fixed;left:50%;top:20px;transform:translateX(-50%);padding:12px 26px 11px;text-align:center;z-index:10;
  transition:opacity .25s;max-width:calc(100vw - 40px)}
#instr .main{font:800 clamp(17px,2.2vw,24px)/1.15 'Orbitron',sans-serif;color:var(--yellow);letter-spacing:.5px;text-shadow:0 0 12px rgba(255,210,63,.35)}
#instr .sub{margin-top:5px;font-size:14px;color:#c4d3e8}
#instr.swap{opacity:0}
#instr.nudge{animation:nudge .4s}
@keyframes nudge{20%,60%{transform:translateX(calc(-50% - 6px))}40%,80%{transform:translateX(calc(-50% + 6px))}}

#bin{position:fixed;right:20px;top:50%;transform:translate(calc(100% + 40px),-50%);padding:14px 14px 10px;z-index:10;
  transition:transform .6s cubic-bezier(.3,1.3,.5,1),opacity .4s}
#bin.show{transform:translate(0,-50%)}
#bin.dim{opacity:.6}
#bin .cells{display:flex;flex-direction:column;gap:10px}
.cell{position:relative;width:118px;border-radius:12px;background:linear-gradient(#0f2142,#0a1730);border:1px solid #1d3762;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px 8px;gap:6px;transition:border-color .3s,box-shadow .3s}
.cell .well{display:grid;place-items:center;flex:1;width:100%}
.cell span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.part{display:block;touch-action:none;transition:transform .18s,filter .3s,opacity .3s;opacity:.4;filter:grayscale(.7);cursor:not-allowed}
.part.active{opacity:1;filter:drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 2px var(--cyan));cursor:grab;animation:float 1.6s ease-in-out infinite}
.part.active:hover{transform:scale(1.1);animation:none}
.part.lifted{visibility:hidden}
.part.used{visibility:hidden}
.cell.active{border-color:var(--cyan);box-shadow:0 0 14px rgba(63,216,255,.35),inset 0 0 12px rgba(63,216,255,.12)}
.cell.active span{color:var(--yellow)}
.cell .grip{position:absolute;top:6px;right:7px;font:700 9px/1 'Orbitron',sans-serif;letter-spacing:1px;color:#0b2440;background:var(--yellow);
  border-radius:4px;padding:3px 4px;opacity:0;transition:opacity .3s}
.cell.active .grip{opacity:1}
.cell.empty::after{content:"✓ installed";position:absolute;inset:auto 0 28px;text-align:center;font-size:11px;color:var(--green);font-weight:700}
@keyframes float{50%{transform:translateY(-4px)}}
.cell.shake{animation:cellShake .35s}
@keyframes cellShake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

.ghost{position:fixed;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)) drop-shadow(0 0 6px var(--cyan));transform:scale(1.08)}
.ghost.anim{transition:left .28s cubic-bezier(.3,1.3,.5,1),top .28s cubic-bezier(.3,1.3,.5,1),width .28s,height .28s}
.ghost.back{transition:left .4s ease-in-out,top .4s ease-in-out,width .4s,height .4s}
.ghost.spinning{animation:spinDriver .275s linear 4;transform-origin:50% 50%}
@keyframes spinDriver{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}

#online{position:fixed;left:50%;top:20px;transform:translate(-50%,-20px);padding:16px 30px 18px;text-align:center;z-index:12;opacity:0;pointer-events:none;
  transition:opacity .5s,transform .5s cubic-bezier(.3,1.4,.5,1);border-color:rgba(62,224,138,.5)}
#online.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#online h2{margin:0;font:800 clamp(24px,3.4vw,40px)/1 'Orbitron',sans-serif;letter-spacing:2px;color:#9ff3ff;
  text-shadow:0 0 10px var(--cyan),0 0 26px rgba(63,216,255,.6)}
#online p{margin:8px 0 14px;color:var(--green);font-weight:600;font-size:14px}
#restart{font:700 14px 'Orbitron',sans-serif;letter-spacing:1.5px;color:#06223a;background:linear-gradient(#7ee6ff,#3fb9ff);border:0;
  border-radius:999px;padding:11px 26px;cursor:pointer;box-shadow:0 0 14px rgba(63,216,255,.55);transition:transform .15s,box-shadow .15s}
#restart:hover{transform:scale(1.06);box-shadow:0 0 22px rgba(63,216,255,.85)}
#restart:active{transform:scale(.97)}

#sparkles{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:14px;height:14px;margin:-7px;background:radial-gradient(circle,#fff 0,#7fe6ff 30%,rgba(63,216,255,0) 70%);
  border-radius:50%;animation:starFly 1.4s ease-out forwards}
@keyframes starFly{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}

/* ---------- Narrow / phone layout ---------- */
@media (max-width:760px){
  #progress{left:10px;right:10px;top:10px;padding:8px 10px;min-width:0}
  #progress h3{display:none}
  #progress ol{flex-direction:row;justify-content:space-between;gap:4px}
  #progress li{flex-direction:column;gap:3px;font-size:11px}
  .dot{width:18px;height:18px}
  #instr,#online{top:76px;padding:9px 16px 8px;width:calc(100vw - 20px)}
  #instr .sub{font-size:12px}
  #bin{left:50%;right:auto;top:auto;bottom:10px;transform:translate(-50%,calc(100% + 40px));padding:8px 10px 6px}
  #bin.show{transform:translate(-50%,0)}
  #bin h3{display:none}
  #bin .cells{flex-direction:row;gap:8px}
  .cell{width:96px;padding:6px 4px 5px}
  .cell span{font-size:11px}
  .cell.empty::after{bottom:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body data-step="open">
<div id="backdrop"></div>
<div id="stage"><div id="cam">
  <div id="platformGlow"></div>
  <div id="robot" class="off">
    <div id="robotInner">
      <img class="arm left" src="left-arm.svg" alt="">
      <img class="arm right" src="right-arm.svg" alt="">
      <div id="head"><img id="headImg" src="dead-head.png" alt="Robot head"><div id="antennaGlow"></div></div>
      <div id="bodyWrap">
        <svg id="interior" viewBox="0 0 111 107" aria-label="Robot interior"></svg>
        <div id="door" role="button" tabindex="0" aria-label="ACCESS panel">
          <div class="face front">
            <img src="Alive-body.png" alt="Robot body">
            <div id="powerBtn" role="button" tabindex="-1" aria-label="Power button"></div>
            <span class="tag">ACCESS</span>
          </div>
          <div class="face back"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="sparkles"></div>
</div></div>
<div id="vignette"></div>

<aside id="progress" class="panel" aria-label="Repair progress">
  <h3>REPAIR PROGRESS</h3>
  <ol>
    <li data-k="wire"><span class="dot">✓</span>Wire</li>
    <li data-k="battery"><span class="dot">✓</span>Battery</li>
    <li data-k="screw"><span class="dot">✓</span>Screw</li>
    <li data-k="memory"><span class="dot">✓</span>Memory</li>
    <li data-k="power"><span class="dot">✓</span>Power</li>
  </ol>
</aside>

<div id="instr" class="panel" role="status" aria-live="polite"><div class="main"></div><div class="sub"></div></div>

<aside id="bin" class="panel" aria-label="Parts bin">
  <h3>PARTS BIN</h3>
  <div class="cells">
    <div class="cell" data-part="battery"><b class="grip">DRAG</b><div class="well"><img class="part" data-part="battery" src="battery-parts.svg" alt="Battery"></div><span>Battery</span></div>
    <div class="cell" data-part="screw"><b class="grip">DRAG</b><div class="well"><img class="part" data-part="screw" src="screw%20driver-parts.svg" alt="Screwdriver"></div><span>Screwdriver</span></div>
    <div class="cell" data-part="memory"><b class="grip">DRAG</b><div class="well"><img class="part" data-part="memory" src="memory%20card-parts.svg" alt="Memory card"></div><span>Memory card</span></div>
  </div>
</aside>

<div id="online" class="panel" role="alert">
  <h2>SYSTEM ONLINE!</h2>
  <p>Repair complete. Your robot is happy.</p>
  <button id="restart" type="button">RESTART</button>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const stage = $('#stage'), cam = $('#cam'), robot = $('#robot'), door = $('#door'), powerBtn = $('#powerBtn');
const headImg = $('#headImg'), svg = $('#interior'), bin = $('#bin'), instr = $('#instr');

// Native asset sizes (viewBox units of the SVGs)
const NATIVE = { battery:{w:34,h:54}, screw:{w:16,h:76}, memory:{w:33.22,h:41.17} };

const TEXT = {
  open:   ['Repair the robot.',        'Click the glowing ACCESS panel to open it'],
  wire:   ['Connect the wire.',        'Drag the glowing wire end to the connector'],
  battery:['Install the battery.',     'Drag the battery into the empty battery slot'],
  screw:  ['Tighten the screw.',       'Drag the screwdriver to the loose screw'],
  memory: ['Insert the memory card.',  'Drag the memory card into its slot'],
  close:  ['Close the panel.',         'All repairs done — click the ACCESS panel'],
  power:  ['Press power.',             'Click the glowing power button'],
  booting:['Booting…',                 ''],
  online: ['', '']
};
const ORDER = ['wire','battery','screw','memory','power'];
let step = 'open', busy = false;

/* ---------- Layout ---------- */
function fit(){
  const s = innerHeight / 1086;
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  const narrow = innerWidth <= 760;
  cam.style.setProperty('--z', narrow ? 1.22 : 1.6);
  const bs = narrow ? Math.min(1.35, innerHeight/620, (innerWidth-60)/3/40)
                    : Math.max(1.05, Math.min(1.7, (innerHeight-170)/ (54+76+41+75)));
  document.querySelectorAll('.part').forEach(p => {
    const n = NATIVE[p.dataset.part];
    p.style.width = n.w*bs + 'px'; p.style.height = n.h*bs + 'px';
  });
  document.querySelectorAll('.cell .well').forEach(w => w.style.minHeight = (narrow ? 76 : 41)*bs + 'px');
}
addEventListener('resize', fit);

/* ---------- Interior drawing ---------- */
const A = {x:12, y:30};          // wire anchor (fixed end)
const REST = {x:25, y:22};       // loose plug rest position
const SOCKET = {x:49, y:16.6};   // plug position when connected
const SCREW = {x:89, y:20};
let P = {...REST};

function buildInterior(){
  svg.innerHTML = `
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="screwGrad" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f6f9fc"/><stop offset="1" stop-color="#8592a5"/></radialGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1f3d"/><stop offset="1" stop-color="#050d1c"/></linearGradient>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0V6" fill="none" stroke="#1b3762" stroke-width=".25"/></pattern>
  </defs>
  <rect x=".4" y=".4" width="110.2" height="106.2" rx="6" fill="#d9dde3" stroke="#a5adb9" stroke-width=".8"/>
  <rect x="4.5" y="4.5" width="102" height="98" rx="3.5" fill="url(#cavity)" stroke="#4d5a70" stroke-width=".6"/>
  <rect x="4.5" y="4.5" width="102" height="98" rx="3.5" fill="url(#grid)" opacity=".7"/>
  <path d="M58 14H78V24M66 46V40H100V60M44 74H54V62M8 104" fill="none" stroke="#1f6fb2" stroke-width=".5" opacity=".55"/>
  <rect x="1.2" y="20" width="2.2" height="12" rx="1" fill="#8a94a3"/><rect x="1.2" y="75" width="2.2" height="12" rx="1" fill="#8a94a3"/>

  <!-- Wire connector -->
  <g id="slotWire" class="slot">
    <ellipse class="halo" cx="${SOCKET.x}" cy="14" rx="13" ry="9"/>
    <rect class="slot-outline" x="37.5" y="6.5" width="23" height="15" rx="2"/>
    <rect x="40" y="9" width="18" height="10" rx="1.2" fill="#1a2333" stroke="#6b7486" stroke-width=".5"/>
    <rect x="45" y="11" width="2" height="6" fill="#05080f"/><rect x="51" y="11" width="2" height="6" fill="#05080f"/>
    <text class="slot-label" x="62.5" y="11.5">WIRE</text>
  </g>

  <!-- Battery slot -->
  <g id="slotBattery" class="slot">
    <rect class="slot-outline" x="9" y="45" width="36" height="56" rx="2.5"/>
    <image class="slot-ghost" href="battery-parts.svg" x="10" y="46" width="34" height="54"/>
    <image id="battImg" class="installed" href="battery-parts.svg" x="10" y="46" width="34" height="54"/>
    <text class="slot-label" x="27" y="43" text-anchor="middle">BATTERY</text>
  </g>

  <!-- Memory card slot -->
  <g id="slotMemory" class="slot">
    <path class="slot-outline" d="M61.5 55.5H83L96 68.2V98H61.5Z"/>
    <image class="slot-ghost" href="memory%20card-parts.svg" x="62" y="56" width="33.22" height="41.17"/>
    <image id="memImg" class="installed" href="memory%20card-parts.svg" x="62" y="56" width="33.22" height="41.17"/>
    <circle id="memLed" cx="91" cy="51" r="1.9"/>
    <text class="slot-label" x="62" y="52">MEMORY</text>
  </g>

  <!-- Screw -->
  <g id="slotScrew" class="slot">
    <circle class="slot-outline" cx="${SCREW.x}" cy="${SCREW.y}" r="7.5"/>
    <circle cx="${SCREW.x}" cy="${SCREW.y}" r="4" fill="#05080f"/>
    <g id="screwBody" class="loose">
      <circle id="screwShadow" cx="${SCREW.x-1.4}" cy="${SCREW.y+1.8}" r="4.6" fill="#000" opacity=".55"/>
      <g id="screwHead" class="loose">
        <circle cx="${SCREW.x}" cy="${SCREW.y}" r="4.6" fill="url(#screwGrad)" stroke="#59626f" stroke-width=".45"/>
        <path d="M${SCREW.x-2.8} ${SCREW.y}h5.6M${SCREW.x} ${SCREW.y-2.8}v5.6" stroke="#3b4350" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
    <text class="slot-label" x="${SCREW.x}" y="${SCREW.y+12}" text-anchor="middle">SCREW</text>
  </g>

  <!-- Wire -->
  <circle cx="${A.x}" cy="${A.y}" r="2.8" fill="#39465c" stroke="#6b7486" stroke-width=".4"/>
  <path id="wireOuter" fill="none" stroke="#141b28" stroke-width="2.6" stroke-linecap="round"/>
  <path id="wireInner" fill="none" stroke="#e35d5d" stroke-width="1.1" stroke-linecap="round"/>
  <g id="plug">
    <circle class="halo" cx="0" cy="5" r="7.5"/>
    <rect x="-2.6" y="0" width="1.3" height="3" fill="#ffc94a"/><rect x="1.3" y="0" width="1.3" height="3" fill="#ffc94a"/>
    <rect x="-4" y="2.4" width="8" height="7" rx="1.2" fill="#2a3445" stroke="#7d8698" stroke-width=".45"/>
    <rect x="-2.5" y="4.4" width="5" height="1" fill="#5cc8ff" opacity=".8"/>
    <circle id="plugHit" cx="0" cy="5" r="11"/>
  </g>
  <g id="checks"></g>`;
  P = {...REST};
  renderWire();
  $('#plug').addEventListener('pointerdown', plugDown);
}

function renderWire(){
  const ex = P.x, ey = P.y + 9.2;
  const d = `M${A.x} ${A.y} C ${A.x+2} ${A.y+14}, ${ex} ${ey+12}, ${ex} ${ey}`;
  $('#wireOuter').setAttribute('d', d);
  $('#wireInner').setAttribute('d', d);
  $('#plug').setAttribute('transform', `translate(${P.x} ${P.y})`);
}

function addCheck(x, y){
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'check');
  g.innerHTML = `<circle cx="${x}" cy="${y}" r="3.6" fill="#3ee08a" stroke="#0b3a24" stroke-width=".4"/>
    <path d="M${x-1.7} ${y}l1.2 1.3 2.3-2.6" fill="none" stroke="#06231a" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>`;
  $('#checks').appendChild(g);
  const s = document.createElementNS(NS, 'circle');
  s.setAttribute('cx', x); s.setAttribute('cy', y); s.setAttribute('r', 5);
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', '#3ee08a'); s.setAttribute('stroke-width', '.6');
  s.setAttribute('class', 'spark');
  $('#checks').appendChild(s);
  setTimeout(() => s.remove(), 800);
}

function toUnits(e){
  const r = svg.getBoundingClientRect();
  return { x:(e.clientX - r.left)/r.width*111, y:(e.clientY - r.top)/r.height*107 };
}
function unitsToScreen(x, y){
  const r = svg.getBoundingClientRect();
  return { x:r.left + x/111*r.width, y:r.top + y/107*r.height, k:r.width/111 };
}

/* ---------- Step machine ---------- */
function setStep(s){
  step = s;
  document.body.dataset.step = s;
  // instruction
  if (s !== 'online'){
    instr.classList.add('swap');
    setTimeout(() => {
      instr.querySelector('.main').textContent = TEXT[s][0];
      instr.querySelector('.sub').textContent = TEXT[s][1];
      instr.querySelector('.sub').style.display = TEXT[s][1] ? '' : 'none';
      instr.classList.remove('swap');
    }, s === 'open' ? 0 : 200);
    instr.style.display = '';
  } else instr.style.display = 'none';
  // progress
  const idx = ORDER.indexOf(s === 'booting' ? 'power' : s);
  document.querySelectorAll('#progress li').forEach(li => {
    const k = ORDER.indexOf(li.dataset.k);
    const doneUpTo = s === 'online' ? ORDER.length : s === 'close' || s === 'power' || s === 'booting' ? 4 : Math.max(idx, 0);
    li.classList.toggle('done', k < doneUpTo);
    li.classList.toggle('current', k === idx && k >= doneUpTo);
  });
  // slots
  document.querySelectorAll('.slot').forEach(g => g.classList.remove('target'));
  const slotMap = {wire:'#slotWire', battery:'#slotBattery', screw:'#slotScrew', memory:'#slotMemory'};
  if (slotMap[s]) $(slotMap[s]).classList.add('target');
  // parts bin
  document.querySelectorAll('.cell').forEach(c => {
    const on = c.dataset.part === s;
    c.classList.toggle('active', on);
    c.querySelector('.part').classList.toggle('active', on);
  });
  bin.classList.toggle('show', ['wire','battery','screw','memory','close'].includes(s));
  bin.classList.toggle('dim', s === 'wire' || s === 'close');
  door.tabIndex = (s === 'open' || s === 'close') ? 0 : -1;
  powerBtn.tabIndex = s === 'power' ? 0 : -1;
}

function nudge(){
  instr.classList.remove('nudge'); void instr.offsetWidth; instr.classList.add('nudge');
}

/* ---------- Door / power ---------- */
function doorActivate(e){
  if (e && e.target === powerBtn && step === 'power') return;
  if (busy) return;
  if (step === 'open'){
    busy = true;
    door.classList.add('open');
    cam.classList.add('zoom');
    setStep('wire_wait');
    document.body.dataset.step = 'opening';
    setTimeout(() => { busy = false; setStep('wire'); }, 850);
  } else if (step === 'close'){
    busy = true;
    document.body.dataset.step = 'closing';
    door.classList.remove('open');
    setTimeout(() => cam.classList.remove('zoom'), 450);
    setTimeout(() => { busy = false; setStep('power'); }, 1250);
  } else if (step !== 'power') nudge();
}
TEXT.wire_wait = ['Opening…', ''];
door.addEventListener('click', doorActivate);
door.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doorActivate(); } });
// clicking the open interior while closing is the next step also closes it
svg.addEventListener('click', () => { if (step === 'close') doorActivate(); });

function powerActivate(e){
  if (step !== 'power') return;          // let the click fall through to the ACCESS panel
  if (e) e.stopPropagation();
  if (busy) return;
  busy = true;
  setStep('booting');
  powerBtn.classList.add('pressed');
  setTimeout(() => powerBtn.classList.remove('pressed'), 150);
  setTimeout(() => { robot.classList.remove('off'); document.body.classList.add('alive-scene'); }, 250);
  setTimeout(() => {
    headImg.classList.add('flicker');
    setTimeout(() => { headImg.src = 'smile-head.svg'; }, 330);
  }, 600);
  setTimeout(sparkle, 1000);
  setTimeout(() => {
    headImg.classList.remove('flicker');
    busy = false;
    setStep('online');
    $('#online').classList.add('show');
    $('#restart').focus({preventScroll:true});
  }, 1700);
}
powerBtn.addEventListener('click', powerActivate);
powerBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); powerActivate(e); } });

function sparkle(){
  const box = $('#sparkles');
  for (let i = 0; i < 22; i++){
    const st = document.createElement('i');
    st.className = 'star';
    const ang = Math.random()*Math.PI*2, dist = 160 + Math.random()*170;
    st.style.left = (724 + Math.cos(ang)*60) + 'px';
    st.style.top = (500 + Math.sin(ang)*90) + 'px';
    st.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    st.style.setProperty('--dy', Math.sin(ang)*dist*.8 + 'px');
    st.style.animationDelay = (Math.random()*.35) + 's';
    box.appendChild(st);
    setTimeout(() => st.remove(), 2000);
  }
}

/* ---------- Wire drag ---------- */
let wireDrag = null;
function plugDown(e){
  if (step !== 'wire' || busy) return;
  e.preventDefault(); e.stopPropagation();
  const u = toUnits(e);
  wireDrag = { id:e.pointerId, dx:P.x - u.x, dy:P.y - u.y };
  svg.setPointerCapture(e.pointerId);
}
svg.addEventListener('pointermove', e => {
  if (!wireDrag || e.pointerId !== wireDrag.id) return;
  const u = toUnits(e);
  P.x = Math.min(102, Math.max(9, u.x + wireDrag.dx));
  P.y = Math.min(92, Math.max(6, u.y + wireDrag.dy));
  renderWire();
  if (Math.hypot(P.x - SOCKET.x, P.y - SOCKET.y) < 9) connectWire();
});
function endWire(e){
  if (!wireDrag || e.pointerId !== wireDrag.id) return;
  wireDrag = null;
  tweenPlug(REST, 450, t => 1 - Math.pow(1 - t, 3) + Math.sin(t*Math.PI)*.12);
}
svg.addEventListener('pointerup', endWire);
svg.addEventListener('pointercancel', endWire);

function tweenPlug(to, ms, ease, done){
  const from = {...P}, t0 = performance.now();
  (function f(now){
    const t = Math.min(1, (now - t0)/ms), k = ease(t);
    P.x = from.x + (to.x - from.x)*k; P.y = from.y + (to.y - from.y)*k;
    renderWire();
    if (t < 1) requestAnimationFrame(f); else done && done();
  })(t0);
}
function connectWire(){
  wireDrag = null; busy = true;
  document.body.dataset.step = 'wired';   // stops glows immediately
  tweenPlug(SOCKET, 140, t => t, () => {
    $('#slotWire').classList.add('done');
    addCheck(60, 7);
    setTimeout(() => { busy = false; setStep('battery'); }, 650);
  });
}

/* ---------- Parts bin drag (battery / screwdriver / memory) ---------- */
let drag = null;
const TARGET = { battery:'#battImg', memory:'#memImg' };

document.querySelectorAll('.part').forEach(p => {
  p.addEventListener('pointerdown', e => {
    if (busy || drag) return;
    if (!p.classList.contains('active')){
      e.preventDefault();
      const cell = p.closest('.cell');
      cell.classList.remove('shake'); void cell.offsetWidth; cell.classList.add('shake');
      nudge();
      return;
    }
    e.preventDefault();
    const r = p.getBoundingClientRect();
    const g = document.createElement('img');
    g.src = p.src; g.className = 'ghost'; g.alt = '';
    Object.assign(g.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
    document.body.appendChild(g);
    p.classList.add('lifted');
    drag = { part:p.dataset.part, el:p, g, id:e.pointerId, ox:e.clientX - r.left, oy:e.clientY - r.top, w:r.width, h:r.height, home:r, over:false };
    try { p.setPointerCapture(e.pointerId); } catch(_){}
  });
  p.addEventListener('pointermove', dragMove);
  p.addEventListener('pointerup', dragEnd);
  p.addEventListener('pointercancel', dragEnd);
  p.addEventListener('dragstart', e => e.preventDefault());
});

function dragMove(e){
  if (!drag || e.pointerId !== drag.id) return;
  const x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  drag.g.style.left = x + 'px'; drag.g.style.top = y + 'px';
  if (drag.part === 'screw'){
    // screwdriver tip = bottom centre of the ghost
    const tip = { x:x + drag.w/2, y:y + drag.h };
    const s = unitsToScreen(SCREW.x, SCREW.y);
    if (Math.hypot(tip.x - s.x, tip.y - s.y) < Math.max(26, 10*s.k)) tightenScrew();
  } else {
    const slot = $(drag.part === 'battery' ? '#slotBattery' : '#slotMemory');
    const over = isOver(drag.part, x + drag.w/2, y + drag.h/2);
    drag.over = over;
    slot.classList.toggle('over', over);
  }
}
function isOver(part, cx, cy){
  const r = $(TARGET[part]).getBoundingClientRect();
  const m = Math.max(14, r.width*.35);
  return cx > r.left - m && cx < r.right + m && cy > r.top - m && cy < r.bottom + m;
}
function moveGhost(g, r, cls){
  g.classList.remove('anim','back'); void g.offsetWidth;
  g.classList.add(cls);
  Object.assign(g.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
}
function returnHome(d, after){
  moveGhost(d.g, d.home, 'back');
  setTimeout(() => { d.g.remove(); d.el.classList.remove('lifted'); after && after(); }, 420);
}

function dragEnd(e){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.part === 'screw'){ returnHome(d); return; }
  const slot = $(d.part === 'battery' ? '#slotBattery' : '#slotMemory');
  slot.classList.remove('over');
  if (!d.over){
    // wrong place → back to the Parts Bin
    returnHome(d, () => { const c = d.el.closest('.cell'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); });
    return;
  }
  busy = true;
  const target = $(TARGET[d.part]);
  moveGhost(d.g, target.getBoundingClientRect(), 'anim');
  d.g.style.transform = 'scale(1)';
  setTimeout(() => {
    d.g.remove();
    d.el.classList.remove('lifted'); d.el.classList.add('used');
    d.el.closest('.cell').classList.add('empty');
    target.classList.add('on');
    slot.classList.add('done');
    if (d.part === 'battery'){
      addCheck(44, 46);
      setTimeout(() => { busy = false; setStep('screw'); }, 700);
    } else {
      setTimeout(() => $('#memLed').classList.add('on'), 200);
      addCheck(95, 97);
      setTimeout(() => { busy = false; setStep('close'); }, 900);
    }
  }, 300);
}

function tightenScrew(){
  const d = drag; drag = null; busy = true;
  try { d.el.releasePointerCapture(d.id); } catch(_){}
  document.body.dataset.step = 'screwing';
  const s = unitsToScreen(SCREW.x, SCREW.y);
  const w = NATIVE.screw.w*s.k, h = NATIVE.screw.h*s.k;
  moveGhost(d.g, {left:s.x - w/2, top:s.y - h, width:w, height:h}, 'anim');
  d.g.style.transform = 'scale(1)';
  d.g.style.transformOrigin = '50% 100%';
  setTimeout(() => {
    d.g.classList.add('spinning');
    $('#screwHead').classList.add('spin');
    $('#screwBody').classList.remove('loose');
    $('#screwShadow').setAttribute('cx', SCREW.x - .4); $('#screwShadow').setAttribute('cy', SCREW.y + .5);
  }, 300);
  setTimeout(() => {
    d.g.classList.remove('spinning');
    const head = $('#screwHead'); head.classList.remove('spin','loose');
    $('#slotScrew').classList.add('done');
    addCheck(SCREW.x + 6, SCREW.y - 5);
    d.g.style.transform = '';
    returnHome(d, () => { busy = false; setStep('memory'); });
  }, 1450);
}

/* ---------- Restart ---------- */
function reset(){
  busy = false; drag = null; wireDrag = null;
  document.querySelectorAll('.ghost').forEach(g => g.remove());
  $('#online').classList.remove('show');
  document.body.classList.remove('alive-scene');
  robot.classList.add('off');
  door.classList.remove('open');
  cam.classList.remove('zoom');
  headImg.src = 'dead-head.png';
  document.querySelectorAll('.part').forEach(p => p.classList.remove('used','lifted'));
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('empty'));
  buildInterior();
  setStep('open');
}
$('#restart').addEventListener('click', reset);

// preload the happy head so the swap is instant
new Image().src = 'smile-head.svg';
fit();
reset();
})();
</script>
